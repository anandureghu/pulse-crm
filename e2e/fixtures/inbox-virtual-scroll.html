<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox virtual scroll e2e fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      /* Mirrors Layout shell */
      .shell {
        display: flex;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #f8fafc;
      }
      .column { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
      .header { flex-shrink: 0; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
      /* Fixed-height route: main must NOT scroll */
      .main {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
        padding-bottom: 64px;
      }
      /* Mirrors Inbox root + conversation column */
      .inbox { display: flex; height: 100%; min-height: 0; min-width: 0; overflow: hidden; }
      .list-col {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-height: 0;
        background: #fff;
        border-right: 1px solid #e5e7eb;
      }
      .list-header { flex-shrink: 0; padding: 16px; border-bottom: 1px solid #e5e7eb; }
      .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        position: relative;
      }
      .virtual-space { position: relative; width: 100%; }
      .row {
        position: absolute;
        left: 0;
        width: 100%;
        padding: 12px;
        border-bottom: 1px solid #f3f4f6;
        background: #fff;
      }
      .row strong { display: block; font-size: 14px; }
      .row span { display: block; font-size: 12px; color: #6b7280; margin-top: 4px; }
      .sentinel { display: flex; align-items: center; justify-content: center; min-height: 40px; color: #9ca3af; font-size: 12px; }
      .bottom-nav {
        position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
        background: #fff; border-top: 1px solid #e5e7eb;
        display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="column">
        <header class="header">pulsrm · mobile chrome</header>
        <main class="main" data-testid="layout-main">
          <div class="inbox">
            <div class="list-col">
              <div class="list-header"><strong>Inbox</strong></div>
              <div class="list" data-testid="inbox-conversation-list" id="list"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <nav class="bottom-nav">Inbox · Contacts · Follow-ups · Pipeline</nav>
    <script>
      const ROW = 88
      const COUNT = 80
      const list = document.getElementById('list')
      const space = document.createElement('div')
      space.className = 'virtual-space'
      space.style.height = `${COUNT * ROW}px`
      list.appendChild(space)

      const sentinel = document.createElement('div')
      sentinel.className = 'sentinel'
      sentinel.dataset.testid = 'inbox-sentinel'
      sentinel.textContent = 'Loading more…'
      list.appendChild(sentinel)

      const mounted = new Map()
      function render() {
        const top = list.scrollTop
        const view = list.clientHeight
        const start = Math.max(0, Math.floor(top / ROW) - 5)
        const end = Math.min(COUNT - 1, Math.ceil((top + view) / ROW) + 5)
        for (const [i, el] of mounted) {
          if (i < start || i > end) {
            el.remove()
            mounted.delete(i)
          }
        }
        for (let i = start; i <= end; i++) {
          if (mounted.has(i)) continue
          const el = document.createElement('div')
          el.className = 'row'
          el.dataset.index = String(i)
          el.style.transform = `translateY(${i * ROW}px)`
          el.innerHTML = `<strong>Conversation ${i + 1}</strong><span>Last message preview for row ${i + 1}</span>`
          space.appendChild(el)
          mounted.set(i, el)
        }
      }
      list.addEventListener('scroll', render, { passive: true })
      render()
      window.__inboxFixture = { list, main: document.querySelector('[data-testid="layout-main"]'), COUNT, ROW }
    </script>
  </body>
</html>
