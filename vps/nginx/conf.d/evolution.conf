# ── Step 1: HTTP — only used for ACME challenge and redirect ─────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN;   # replaced by init-ssl.sh

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Step 2: HTTPS — proxies to Evolution API container ──────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name YOUR_DOMAIN;   # replaced by init-ssl.sh

    # Docker embedded DNS — needed for variable proxy_pass
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Certificates issued by Certbot
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern TLS only
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS (1 year) — only enable after confirming HTTPS works
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Evolution API REST + WebSocket ────────────────────────────────────────
    location / {
        # Rate-limit general API calls
        limit_req zone=api burst=20 nodelay;

        # Dynamic resolve so nginx can start even if evolution is briefly down
        set $evolution_upstream evolution:8080;
        proxy_pass         http://$evolution_upstream;
        proxy_http_version 1.1;

        # WebSocket support (Evolution uses WS for QR updates)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Buffer tweaks for large message payloads
        proxy_buffer_size          16k;
        proxy_buffers              8 16k;
        proxy_busy_buffers_size    32k;
    }

    # ── Webhook endpoint — slightly higher rate limit ─────────────────────────
    # Evolution calls out to Supabase Edge Functions; this block handles inbound webhook calls
    location /webhook {
        limit_req zone=webhook burst=60 nodelay;

        set $evolution_upstream evolution:8080;
        proxy_pass         http://$evolution_upstream/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block access to sensitive Evolution internals ─────────────────────────
    location ~* ^/(manager|metrics|health/detail) {
        allow 127.0.0.1;
        deny  all;
    }
}
